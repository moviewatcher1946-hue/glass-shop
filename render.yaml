databases:
  - name: glass-shop-db
    plan: free

services:
  - type: web
    name: glass-shop
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: glass-shop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: raven
      - key: ADMIN_PASSWORD
        sync: false
