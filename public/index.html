<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snack Shop</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
  </script>
  <script>
    // Start fetching the shop's products and photos right away, while the page and the startup animation are still loading.
    (function () {
      function get(u) { return fetch(u).then(function (r) { if (!r.ok) throw 0; return r.json(); }); }
      var data = Promise.all([get('/api/products'), get('/api/combos'), get('/api/settings')]);
      window.__pre = data; // app.js picks this up instead of asking the server again
      data.catch(function () {});
      window.__preReady = data.then(function (d) {
        var urls = [];
        d[0].forEach(function (p) { if (p.image_url) urls.push(p.image_url); });
        d[1].forEach(function (c) { (c.items || []).slice(0, 4).forEach(function (x) { if (x.image_url && urls.indexOf(x.image_url) < 0) urls.push(x.image_url); }); });
        var first = urls.slice(0, 12), rest = urls.slice(12); // wait for the first screenful, quietly warm up the rest
        return Promise.all(first.map(function (u) { return new Promise(function (ok) { var i = new Image(); i.onload = i.onerror = ok; i.src = u; }); }))
          .then(function () { rest.forEach(function (u) { new Image().src = u; }); });
      }).catch(function () {});
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="app.js" as="script">
  <link rel="preload" href="tour.js" as="script">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Snack Shop">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#fafafa">
</head>
<body>
  <div id="boot" aria-hidden="true">
    <div class="boot-logo"><img src="icon-192.png" alt="" width="96" height="96"></div>
    <div class="boot-title"><span style="--i:0">S</span><span style="--i:1">n</span><span style="--i:2">a</span><span style="--i:3">c</span><span style="--i:4">k</span><span style="--i:5">&nbsp;</span><span style="--i:6">S</span><span style="--i:7">h</span><span style="--i:8">o</span><span style="--i:9">p</span></div>
    <div class="boot-bar"><i></i></div>
  </div>
  <script>
    // Startup animation: plays once each time the app is opened (not on every page change). Tap to skip. Skipped for reduced-motion.
    // It lifts when it has played for at least 1.4s AND the shop's products and first photos are loaded (never later than 3.8s).
    (function () {
      var b = document.getElementById('boot'), body = document.body, seen = false, shown = false, minDone = false, ready = false;
      try { seen = sessionStorage.boot === '1'; sessionStorage.boot = '1'; } catch (e) {}
      if (seen || matchMedia('(prefers-reduced-motion: reduce)').matches) { b.remove(); return; }
      body.classList.add('booting'); // hides the page underneath so the phone only has the animation to draw
      function lift(cls, ms) {
        if (shown) return; shown = true;
        b.classList.add(cls);
        body.classList.remove('booting');
        window.dispatchEvent(new Event('bootdone'));
        setTimeout(function () { b.remove(); }, ms);
      }
      function check() { if (minDone && ready) lift('out', 650); }
      b.onclick = function () { lift('skip', 400); };
      // Start the clock only after the browser has painted the first frame, so a slow phone doesn't lose the first half second.
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        b.classList.add('go');
        setTimeout(function () { minDone = true; check(); }, 1400);
        setTimeout(function () { lift('out', 650); }, 3800);
      }); });
      (window.__preReady || Promise.resolve()).then(function () { ready = true; check(); });
      setTimeout(function () { lift('skip', 0); }, 7000); // safety net
    })();
  </script>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <header class="glass nav">
    <h1><img class="logo" src="icon-192.png" alt="" width="36" height="36">Shop</h1>
    <div class="tools">
      <nav id="nav"></nav>
      <button id="tour-btn" type="button">Tutorial</button>
      <button id="theme" type="button"></button>
    </div>
  </header>
  <main id="app"></main>
  <dialog id="dlg" class="glass"></dialog>
  <div id="toast" class="glass" role="status"></div>
  <script>
    const tb = document.getElementById('theme');
    const label = () => tb.textContent = document.documentElement.dataset.theme === 'dark' ? 'Light mode' : 'Dark mode';
    tb.onclick = () => {
      const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      try { localStorage.theme = t; } catch (e) {}
      label();
    };
    label();
  </script>
  <script>
    // The app's scripts start a moment after the startup animation does, so they can't freeze it.
    (function () {
      function load(src, cb) { var s = document.createElement('script'); s.src = src; if (cb) s.onload = cb; document.body.appendChild(s); }
      function start() { load('app.js', function () { load('tour.js'); }); }
      if (document.getElementById('boot')) setTimeout(start, 300); else start();
    })();
  </script>
</body>
</html>
